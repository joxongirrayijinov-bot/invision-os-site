<style>
:root{color-scheme:dark;--bg:#0e1116;--surface:#151a21;--line:#262e39;--fg:#e7ebf1;--muted:#8b96a6;--accent:#4f8cff;--bad:#ef5a5a}

*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-left,0px))}
.box{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 24px;display:flex;flex-direction:column;gap:14px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
h1{margin:0;font-size:18px}p{margin:0;color:var(--muted);font-size:13px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
button{font:inherit;font-weight:700;padding:11px;border-radius:9px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}.err{color:var(--bad);font-size:13px;min-height:1.2em}
</style></head><body>

<script>
(function(){
  var P = JSON.parse(document.getElementById('payload').textContent);
  var b64 = function(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; };
  var toB64 = function(a){ var s=''; a=new Uint8Array(a); for (var i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); };
  var KEY='os.key', f=document.getElementById('f'), pw=document.getElementById('pw'), err=document.getElementById('err'), go=document.getElementById('go'), rem=document.getElementById('rem');
  function show(html){
    // не document.write: заменяем документ целиком и заново запускаем inline-скрипты страницы
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var scripts = Array.prototype.slice.call(doc.querySelectorAll('script'));
    scripts.forEach(function(s){ s.parentNode.removeChild(s); });
    document.replaceChild(document.adoptNode(doc.documentElement), document.documentElement);
    scripts.forEach(function(s){ var n = document.createElement('script'); if (s.src) n.src = s.src; else n.textContent = s.textContent; document.body.appendChild(n); });
  }
  async function decryptWith(key){
    var plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.ct));
    return new TextDecoder().decode(plain);
  }
  async function keyFromPassword(p){
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
  }
  (async function tryStored(){
    var raw=null; try { raw = localStorage.getItem(KEY); } catch(e){}
    if (!raw) return;
    try {
      var key = await crypto.subtle.importKey('raw', b64(raw), {name:'AES-GCM'}, false, ['decrypt']);
      show(await decryptWith(key));
    } catch(e) { try { localStorage.removeItem(KEY); } catch(_){} }
  })();
  f.addEventListener('submit', async function(ev){
    ev.preventDefault(); err.textContent=''; go.disabled=true; go.textContent='Проверяю…';
    try {
      var key = await keyFromPassword(pw.value);
      var html = await decryptWith(key);
      if (rem.checked) { try { localStorage.setItem(KEY, toB64(await crypto.subtle.exportKey('raw', key))); } catch(e){} }
      show(html);
    } catch(e) {
      err.textContent = 'Пароль не подошёл.'; go.disabled=false; go.textContent='Открыть'; pw.select();
    }
  });
})();
</script></body></html>
